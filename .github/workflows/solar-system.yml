name: Solar system Workflow
on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:

env:
  MONGO_URI: mongodb+srv://cluster0.s6hco5c.mongodb.net/?appName=Cluster0
  MONGO_USERNAME: roczyno
  MONGO_PASSWORD: Password1@

jobs:
  unit-testing:
    name: Unit Testing
    services:
      mongodb:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
      MONGO_URI: "mongodb://localhost:27017/superData"
      MONGO_PASSWORD: "non-prod-password"
      MONGO_USERNAME: "non-prod-user"
    strategy:
      matrix:
        node-version: [ 18, 19, 20 ]
        operating-system: [ ubuntu-latest ]
        exclude:
          - node-version: 18
            operating-system: macos-latest
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        id: nodejs-tests
        run: npm test

      - name: archive test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mocha-test-results-${{ matrix.node-version }}-${{ matrix.operating-system
            }}
          path: test-results.xml

  code-coverage:
    name: Code Coverage
    container:
      image: node:18
    services:
      mongodb:
        image: siddharth67/mongo-db:non-prod
        options: --name mongo
    env:
      MONGO_URI: "mongodb://mongo:27017/superData"
      MONGO_PASSWORD: "non-prod-password"
      MONGO_USERNAME: "non-prod-user"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # - name: Set up Node.js
      #   uses: actions/setup-node@v2
      #   with:
      #     node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  docker:
    needs: [ unit-testing, code-coverage ]
    name: Build and Push Docker Image
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: login to GHRC
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build build for testing
        uses: docker/build-push-action@v6
        with:
          context: "."
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=${{ env.MONGO_URI }} \
            -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

          echo "Waiting for container..."
          sleep 10

          echo "Testing API endpoint..."
          curl -f http://127.0.0.1:3000/live

      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: "."
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  dev-deploy:
    needs: docker
    if: contains(github.ref, 'feature/')
    name: Dev Deploy
    uses: ./.github/workflows/resuse-deployment.yml
    with:
      environment-name: development
      manifests-dir: kubernetes/development
      install-ingress: true
    secrets: inherit

  prod-deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    name: Prod Deploy
    uses: ./.github/workflows/resuse-deployment.yml
    with:
      environment-name: production
      manifests-dir: kubernetes/staging
      install-ingress: false
    secrets: inherit
