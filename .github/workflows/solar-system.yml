name: Solar system Workflow
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - feature/*

env:
    MONGO_URI: mongodb+srv://cluster0.s6hco5c.mongodb.net/?appName=Cluster0
    MONGO_USERNAME: roczyno
    MONGO_PASSWORD: Password1@

jobs:
    unit-testing:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test