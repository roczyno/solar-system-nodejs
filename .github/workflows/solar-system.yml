name: Solar system Workflow
on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:

env:
  MONGO_URI: mongodb+srv://cluster0.s6hco5c.mongodb.net/?appName=Cluster0
  MONGO_USERNAME: roczyno
  MONGO_PASSWORD: Password1@

jobs:
  unit-testing:
    name: Unit Testing
    services:
      mongodb:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
      MONGO_URI: "mongodb://localhost:27017/superData"
      MONGO_PASSWORD: "non-prod-password"
      MONGO_USERNAME: "non-prod-user"
    strategy:
      matrix:
        node-version: [ 18, 19, 20 ]
        operating-system: [ ubuntu-latest ]
        exclude:
          - node-version: 18
            operating-system: macos-latest
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        id: nodejs-tests
        run: npm test

      - name: archive test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mocha-test-results-${{ matrix.node-version }}-${{ matrix.operating-system
            }}
          path: test-results.xml

  code-coverage:
    name: Code Coverage
    container:
      image: node:18
    services:
      mongodb:
        image: siddharth67/mongo-db:non-prod
        options: --name mongo
    env:
      MONGO_URI: "mongodb://mongo:27017/superData"
      MONGO_PASSWORD: "non-prod-password"
      MONGO_USERNAME: "non-prod-user"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # - name: Set up Node.js
      #   uses: actions/setup-node@v2
      #   with:
      #     node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  docker:
    needs: [ unit-testing, code-coverage ]
    name: Build and Push Docker Image
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: login to GHRC
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build build for testing
        uses: docker/build-push-action@v6
        with:
          context: "."
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=${{ env.MONGO_URI }} \
            -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

          echo "Waiting for container..."
          sleep 10

          echo "Testing API endpoint..."
          curl -f http://127.0.0.1:3000/live

      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: "."
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  dev-deploy:
    needs: docker
    runs-on: ubuntu-latest
    name: Deploy to Development Environment

    outputs:
      ingress_host: ${{ steps.ingress.outputs.host }}
      app_ingress_url: ${{ steps.ingress.outputs.app_ingress_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Generate kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name my-eks-cluster

      - name: Verify cluster
        run: kubectl get nodes

      - name: Install NGINX Ingress Controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/aws/deploy.yaml

      - name: Wait for ingress controller
        run: |
          kubectl wait --namespace ingress-nginx \
            --for=condition=available deployment/ingress-nginx-controller \
            --timeout=180s

      - name: Get ingress external hostname
        id: ingress
        run: |
          for i in {1..30}; do
            HOST=$(kubectl get svc ingress-nginx-controller \
              -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$HOST" ]; then
              echo "host=$HOST" >> $GITHUB_OUTPUT
              echo "app_ingress_url=solar-system-${{ vars.NAMESPACE }}.$HOST.nip.io" >> $GITHUB_OUTPUT
              echo "Ingress host: $HOST"
              exit 0
            fi

            echo "Waiting for ingress hostname..."
            sleep 10
          done

          echo "Ingress hostname not ready"
          exit 1

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${{ vars.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Replace tokens in manifests
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: "_{_"
          tokenSuffix: "_}_"
          files: "kubernetes/development/*.yaml"
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
          INGRESS_IP: ${{ steps.ingress.outputs.host }}
          APP_INGRESS_URL: ${{ steps.ingress.outputs.app_ingress_url }}

      - name: Secret for MongoDB credentials
        run: |
          kubectl create secret generic mongo-db-creds \
            --namespace ${{ vars.NAMESPACE }} \
            --from-literal=username=${{ env.MONGO_USERNAME }} \
            --from-literal=password=${{ env.MONGO_PASSWORD }} \
            --from-literal=uri=${{ env.MONGO_URI }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to cluster
        run: |
          kubectl apply -f kubernetes/development

  Integration-tests:
    needs: dev-deploy
    runs-on: ubuntu-latest
    name: Dev Integration Tests

    steps:
      - name: Install curl + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Wait for app to be ready
        run: |
          URL=http://${{ needs.dev-deploy.outputs.app_ingress_url }}

          for i in {1..20}; do
            if curl -s $URL > /dev/null; then
              echo "App is up at $URL"
              exit 0
            fi

            echo "Waiting for app..."
            sleep 10
          done

          echo "App not responding"
          exit 1

      - name: Test endpoint
        run: |
          URL=http://${{ needs.dev-deploy.outputs.app_ingress_url }}
          echo "Testing $URL"
          curl -s $URL | jq .
